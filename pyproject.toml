    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-postgres>=3.1.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "optuna>=4.9.0",
    "psycopg[binary,pool]>=3.3.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "torch>=2.13.0",
