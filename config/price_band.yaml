models:
  - xgboost
  - lightgbm
  - ensemble

features:
  rolling_windows: [5, 10, 20, 50]
  technical_indicators: [sma, ema, rsi, macd, bollinger]
  volatility: [parkinson, close_to_close, garman_klass]

validation:
  method: purged_walk_forward
  n_splits: 5
  gap: 5

evaluation:
  metrics: [rmse, mae, hit_rate, sharpe]
  baseline: persistence
